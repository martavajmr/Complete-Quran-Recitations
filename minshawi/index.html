<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Sheikh Muhammad Siddiq Al-Minshawi | Quran Recitation</title>
<style>
:root{--green:#167447;--pale:#eaf5ef;--ink:#17251d;--muted:#718078;--line:#e6ece8}
*{box-sizing:border-box}body{margin:0;background:#f6f9f7;color:var(--ink);font:15px/1.45 Arial,sans-serif}
header{background:linear-gradient(145deg,#0d5a35,#238653);color:#fff;padding:24px 18px 22px;border-radius:0 0 24px 24px}
.top{display:flex;align-items:center;gap:15px;max-width:760px;margin:auto}
.portrait{width:92px;height:92px;object-fit:cover;border-radius:18px;border:3px solid #ffffff80;box-shadow:0 5px 16px #00351e40}
h1{font-size:20px;line-height:1.2;margin:0 0 7px}header p{margin:0;color:#e0f1e7;font-size:13px}
main{max-width:760px;margin:18px auto 120px;padding:0 14px}
.tools{display:flex;gap:9px;margin:14px 0 12px}
input{min-width:0;flex:1;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:white;font-size:15px;outline:none}
.filter{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 13px;color:var(--green);font-weight:700}
.count{font-size:12px;color:var(--muted);margin:10px 3px}
.list{display:grid;gap:8px}
.surah{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:white;color:var(--ink);cursor:pointer}
.surah.active{border-color:#62a982;background:var(--pale)}
.thumb{width:43px;height:43px;flex:none;border-radius:11px;overflow:hidden;background:#e4eee8}
.thumb img{width:100%;height:100%;object-fit:cover}
.surahtext{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}.surahtext b{font-size:14px}.surahtext small{font-size:11px;color:var(--muted)}
.playmark{color:var(--green);font-size:16px;padding:5px}
.player{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -5px 22px #153d2712;padding:12px max(14px,calc((100% - 732px)/2)) calc(12px + env(safe-area-inset-bottom));z-index:5}
.now{display:flex;align-items:center;gap:10px;margin-bottom:7px}.now img{width:38px;height:38px;border-radius:9px;object-fit:cover}.nowtext{flex:1;min-width:0}.nowtext b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nowtext small{color:var(--muted);font-size:11px}
.controls{display:flex;align-items:center;justify-content:center;gap:18px}.controls button{border:0;background:none;color:var(--green);font-size:20px;padding:5px 9px;cursor:pointer}.controls .mainplay{width:42px;height:42px;border-radius:50%;background:var(--green);color:white;font-size:17px}
.seekrow{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--muted)}input[type=range]{padding:0;accent-color:var(--green);height:18px}
.modes{display:flex;justify-content:space-between;margin-top:4px}.modes button{border:0;background:none;color:var(--muted);font-size:11px;padding:4px}.modes button.on{color:var(--green);font-weight:bold}
@media(min-width:600px){.list{grid-template-columns:1fr 1fr}}
</style>
</head>

<section class="player" aria-label="Audio player">
 <div class="now"><img src="reciter.jpg" alt=""><div class="nowtext"><b id="nowTitle">Choose a Surah to begin</b><small id="status">Sheikh Muhammad Siddiq Al-Minshawi</small></div></div>
 <div class="seekrow"><span id="current">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="duration">0:00</span></div>
 <div class="controls"><button id="prev" aria-label="Previous Surah">⏮</button><button class="mainplay" id="play" aria-label="Play or pause">▶</button><button id="next" aria-label="Next Surah">⏭</button></div>
 <div class="modes"><button id="repeat">↻ Repeat: Off</button><button id="fav">♡ Add favourite</button><button id="minimize">Hide player</button></div>
</section>
<audio id="audio" preload="none"></audio>
<script>
const BASE='https://cdn.jsdelivr.net/gh/martavajmr/minshawi@main/';
const audio=document.getElementById('audio'), list=document.getElementById('list');
const rows=[...document.querySelectorAll('.surah')];
let currentIndex=-1, repeatMode=0, favOnly=false, minimized=false;
let favourites=JSON.parse(localStorage.getItem('minshawi_favs')||'[]');
let recent=JSON.parse(localStorage.getItem('minshawi_recent')||'[]');
const fmt=s=>{if(!Number.isFinite(s))return '0:00';let m=Math.floor(s/60),r=Math.floor(s%60);return m+':'+String(r).padStart(2,'0')};
function updateFavButton(){document.getElementById('fav').textContent=currentIndex<0?'♡ Add favourite':(favourites.includes(rows[currentIndex].dataset.num)?'♥ Remove favourite':'♡ Add favourite')}
function select(i,autoplay=true){if(i<0||i>=rows.length)return;currentIndex=i;const row=rows[i],num=row.dataset.num;audio.src=BASE+num+'.mp3';document.getElementById('nowTitle').textContent=num+'. '+row.dataset.name;document.getElementById('status').textContent='Sheikh Muhammad Siddiq Al-Minshawi';rows.forEach((r,j)=>r.classList.toggle('active',j===i));recent=[num,...recent.filter(x=>x!==num)].slice(0,12);localStorage.setItem('minshawi_recent',JSON.stringify(recent));updateFavButton();if(autoplay)audio.play().then(()=>document.getElementById('play').textContent='Ⅱ').catch(()=>document.getElementById('status').textContent='Tap play to start audio');}
rows.forEach((r,i)=>r.addEventListener('click',()=>{if(i===currentIndex){if(audio.paused)audio.play();else audio.pause()}else select(i)}));
document.getElementById('play').onclick=()=>{if(currentIndex<0)select(0);else if(audio.paused)audio.play();else audio.pause()};
audio.onplay=()=>{document.getElementById('play').textContent='Ⅱ';document.getElementById('status').textContent='Now playing'};
audio.onpause=()=>document.getElementById('play').textContent='▶';
audio.ontimeupdate=()=>{if(audio.duration)document.getElementById('seek').value=audio.currentTime/audio.duration*1000;document.getElementById('current').textContent=fmt(audio.currentTime);document.getElementById('duration').textContent=fmt(audio.duration)};
audio.onended=()=>{if(repeatMode===1){audio.currentTime=0;audio.play()}else if(currentIndex<rows.length-1)select(currentIndex+1);else if(repeatMode===2)select(0)};
document.getElementById('seek').oninput=e=>{if(audio.duration)audio.currentTime=e.target.value/1000*audio.duration};
document.getElementById('prev').onclick=()=>select(Math.max(0,currentIndex-1));
document.getElementById('next').onclick=()=>select(Math.min(rows.length-1,currentIndex+1));
document.getElementById('repeat').onclick=()=>{repeatMode=(repeatMode+1)%3;document.getElementById('repeat').textContent=['↻ Repeat: Off','↻ Repeat: One','↻ Repeat: All'][repeatMode];document.getElementById('repeat').classList.toggle('on',repeatMode!==0)};
document.getElementById('fav').onclick=()=>{if(currentIndex<0)return;let n=rows[currentIndex].dataset.num;favourites=favourites.includes(n)?favourites.filter(x=>x!==n):[...favourites,n];localStorage.setItem('minshawi_favs',JSON.stringify(favourites));updateFavButton();render()};
function render(){let q=document.getElementById('search').value.toLowerCase(),shown=0;rows.forEach(r=>{let ok=r.dataset.name.toLowerCase().includes(q)||r.dataset.num.includes(q);if(favOnly)ok=ok&&favourites.includes(r.dataset.num);r.style.display=ok?'flex':'none';if(ok)shown++});document.getElementById('count').textContent=shown+' Surahs'}
document.getElementById('search').oninput=render;
document.getElementById('favFilter').onclick=()=>{favOnly=!favOnly;document.getElementById('favFilter').textContent=favOnly?'♥ Favourites':'♡ Favourites';document.getElementById('favFilter').style.background=favOnly?'#eaf5ef':'#fff';render()};
document.getElementById('minimize').onclick=()=>{document.querySelector('.player').style.display='none';minimized=true;let b=document.getElementById('restorePlayer');if(!b){b=document.createElement('button');b.id='restorePlayer';b.textContent='♫ Show player';b.style='position:fixed;bottom:12px;right:12px;z-index:8;background:#167447;color:white;border:0;border-radius:22px;padding:12px 16px';document.body.appendChild(b);b.onclick=()=>{document.querySelector('.player').style.display='block';b.remove();minimized=false}}};
history.pushState({page:'surah-list'},'','#surahs');
window.addEventListener('popstate',()=>{if(!minimized){document.querySelector('.player').style.display='none';minimized=true}});
</script>
</body></html>
