const buttons=[...list.children];
function select(i){if(i<0||i>=rows.length)return;current=i;const s=rows[i];audio.src=CFG.base+s.file;document.getElementById('nowTitle').textContent=String(s.number).padStart(3,'0')+'. '+s.name;document.getElementById('status').textContent=CFG.name;buttons.forEach((b,j)=>b.classList.toggle('active',j===i));document.getElementById('fav').textContent=favorites.includes(s.number)?'♥ Remove favourite':'♡ Add favourite';audio.play().catch(()=>document.getElementById('status').textContent='Tap play to start audio')}

audio.onplay=()=>document.getElementById('play').textContent='Ⅱ';audio.onpause=()=>document.getElementById('play').textContent='▶';

document.getElementById('repeat').onclick=()=>{repeat=(repeat+1)%3;document.getElementById('repeat').textContent=['↻ Repeat: Off','↻ Repeat: One','↻ Repeat: All'][repeat];document.getElementById('repeat').classList.toggle('on',repeat!==0)};
